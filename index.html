            right: 20px;

        }

        }
        select, button {

            padding: 8px;
            border: 1px solid #6a1b9a;
            border-radius: 4px;
            margin-bottom: 10px;
        }
        button {
            background: #6a1b9a;
            color: white;
            border: none;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background: #7b1fa2;
        }
        .info-panel {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.9);
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
            z-index: 1000;
            max-width: 300px;
            max-height: 400px;
            overflow-y: auto;
        }
        .education-item {
            margin: 10px 0;
            padding: 10px;
            border-radius: 4px;
            border-left: 4px solid;
        }
        .education-item.xdf {
            background: #e8f5e9;
            border-left-color: #2e7d32;
        }
        .education-item.highschool {
            background: #e3f2fd;
            border-left-color: #1976d2;
        }
        .education-item.middleschool {
            background: #fff3e0;

        }
        .education-item.primaryschool {

            border-left-color: #c2185b;
        }
        .education-item h4 {
            color: #6a1b9a;
            margin-bottom: 5px;
        }
        .education-item p {
            color: #7b1fa2;
            font-size: 14px;
            margin: 5px 0;
        }
        .legend {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.9);
            padding: 10px;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
            z-index: 1000;
        }
        .legend-item {
            display: flex;
            align-items: center;
            margin: 5px 0;
        }
        .legend-icon {
            width: 20px;
            height: 20px;
            margin-right: 10px;
            border-radius: 4px;
        }
        .legend-icon.xdf {
            background-color: #2e7d32;
        }
        .legend-icon.highschool {

        }
        .legend-icon.middleschool {

        .legend-icon.primaryschool {

    <div class="control-panel">

            <label>教育类型：</label>
            <select id="educationType">

                <option value="xdf">新东方</option>
                <option value="highschool">高中</option>
                <option value="middleschool">初中</option>
                <option value="primaryschool">小学</option>

        </div>
        <div class="control-item">
            <label>学校等级：</label>
            <select id="schoolLevel">
                <option value="all">全部等级</option>
                <option value="key">重点</option>
                <option value="normal">普通</option>
            </select>
        </div>
        <button onclick="toggleInfo()">显示/隐藏详情</button>
        <button onclick="showStatistics()">显示统计信息</button>
        <button onclick="toggleLabels()">显示/隐藏学校名称</button>
    </div>
    <div class="info-panel" id="infoPanel">

    </div>

            },
            
            "新东方嘉禾校区": {
                point: new BMap.Point(118.137736,24.512129),
                type: "xdf", // 新东方类型
                level: "key",
                schooltype: "高中培训机构",
                description: "湖里区圆山南路800号A座新东方嘉禾欣悦里二楼、三楼",

            },

            "新东方同安校区（西安路）": {
                point: new BMap.Point(118.156245,24.735426),
                type: "xdf", // 新东方类型
                level: "key",
                schooltype: "高中培训机构",
                description: "同安区松柏林北街41号二楼",
                phone: "0592-5107101",
            },

            "新东方镇海玉滨城校区": {
                point: new BMap.Point(118.093614,24.462791),
                type: "xdf", // 新东方类型
                level: "key",
                schooltype: "高中培训机构",
                description: "思明区公园南路33号（二楼）",
                phone: "",
            },

            "新东方同安校区": {
                point: new BMap.Point(118.158095,24.737337),
                type: "xdf", // 新东方类型
                level: "key",
                schooltype: "初中培训机构",
                description: "同安区大同街道三秀南里30-1智慧空间",
                phone: "",
            },
        };

        var markers = []; // 存储所有地图标记
        var currentType = 'all'; // 当前筛选的教育类型（默认全部）
        var currentLevel = 'all'; // 当前筛选的学校等级（默认全部）

        // 4. 生成不同类型的图标（颜色与图例完全匹配）
        function getSchoolIcon(type) {
            // 颜色映射表（与CSS图例的background-color一致）
            var colorMap = {
                xdf: '#2e7d32', // 新东方：绿色
                highschool: '#1976d2', // 高中：蓝色
                middleschool: '#ef6c00', // 初中：橙色
                primaryschool: '#c2185b' // 小学：粉色
            };

            // 定义优先级顺序
            var priorityOrder = ['highschool', 'middleschool', 'primaryschool'];

            // 根据优先级顺序获取颜色
            var iconColor = null;
            for (var i = 0; i < priorityOrder.length; i++) {
                if (Array.isArray(type)) {
                    if (type.includes(priorityOrder[i])) {
                        iconColor = colorMap[priorityOrder[i]];
                        break;
                    }
                } else {
                    if (type === priorityOrder[i]) {
                        iconColor = colorMap[priorityOrder[i]];
                        break;
                    }
                }
            }

            // 如果没有匹配到任何优先级类型，则使用默认灰色
            if (!iconColor) {
                iconColor = colorMap[type] || '#9e9e9e';
            }

            // 正确创建SVG图标（圆形，带白色边框，避免与地图背景融合）
            var svgStr = `
                <svg width="20" height="20" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="10" cy="10" r="8" fill="${iconColor}" stroke="white" stroke-width="2"/>
                </svg>
            `;
            // 将SVG转为Base64编码（百度地图支持的图标格式）
            var svgBase64 = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svgStr)));

            // 返回百度地图图标对象（大小20x20，锚点在中心）
            return new BMap.Icon(svgBase64, new BMap.Size(20, 20), {
                anchor: new BMap.Size(10, 10) // 图标中心点与坐标点对齐
            });
        }

        // 获取学校类型的优先级颜色类名
        function getSchoolTypeClass(type) {
            // 定义优先级顺序
            var priorityOrder = ['highschool', 'middleschool', 'primaryschool'];

            // 根据优先级顺序获取类型类名
            for (var i = 0; i < priorityOrder.length; i++) {
                if (Array.isArray(type)) {
                    if (type.includes(priorityOrder[i])) {
                        return priorityOrder[i];
                    }
                } else {
                    if (type === priorityOrder[i]) {
                        return priorityOrder[i];
                    }
                }
            }

            // 默认返回第一个类型
            if (Array.isArray(type) && type.length > 0) {
                return type[0];
            }
            return type;
        }

        // 5. 更新信息面板（根据筛选条件显示学校详情）
        function updateInfo() {
            var infoList = document.getElementById('infoList');
            infoList.innerHTML = ''; // 清空原有内容

            Object.keys(educationData).forEach(schoolName => {
                var school = educationData[schoolName];
                // 筛选条件：类型匹配 + 等级匹配
                if ((currentType === 'all' || (Array.isArray(school.type) ? school.type.includes(currentType) : school.type === currentType)) &&
                    (currentLevel === 'all' || school.level === currentLevel)) {
                    var infoItem = document.createElement('div');
                    var typeClass = getSchoolTypeClass(school.type);
                    infoItem.className = `education-item ${typeClass}`;
                    infoItem.innerHTML = `
                        <h4>${schoolName}</h4>
                        <p>学校等级：${school.level === 'key' ? '重点' : '普通'}</p>
                        <p>办学类型：${school.schooltype}</p>
                        <p>联系方式：${school.phone}</p>
                        <p>地址：${school.description}</p>
                    `;
                    infoList.appendChild(infoItem);
                }
            });
        }

        // 6. 更新地图标记（根据筛选条件显示/隐藏标记，且图标颜色匹配类型）
        function updateMarkers() {
            clearMarkers(); // 先清除所有旧标记

            Object.keys(educationData).forEach(schoolName => {
                var school = educationData[schoolName];
                // 筛选条件：类型匹配 + 等级匹配
                if ((currentType === 'all' || (Array.isArray(school.type) ? school.type.includes(currentType) : school.type === currentType)) &&
                    (currentLevel === 'all' || school.level === currentLevel)) {
                    addMarker(schoolName, school); // 添加新标记
                }
            });
        }

        // 清除所有地图标记
        function clearMarkers() {
            markers.forEach(marker => map.removeOverlay(marker));
            markers = []; // 清空标记数组
        }

        // 添加单个地图标记（含点击事件）
        function addMarker(schoolName, school) {
            // 6.1 获取当前学校类型对应的图标
            var schoolIcon = getSchoolIcon(school.type);
            // 6.2 创建标记（坐标为学校坐标，图标为类型对应的颜色）
            var marker = new BMap.Marker(school.point, { icon: schoolIcon });
            // 6.3 给标记添加标签（显示学校名称）
            var label = new BMap.Label(schoolName, {
                offset: new BMap.Size(20, -10) // 标签位置：标记右侧20px，上方10px
            });
            marker.setLabel(label);
            // 6.4 点击标记时显示学校详情
            marker.addEventListener("click", function() {
                showSchoolInfo(schoolName, school);
            });
            // 6.5 添加标记到地图，并存入数组
            map.addOverlay(marker);
            markers.push(marker);
        }

        // 显示/隐藏信息面板
        function toggleInfo() {
            var infoPanel = document.getElementById('infoPanel');
            infoPanel.style.display = infoPanel.style.display === 'none' ? 'block' : 'none';
        }

        // 显示统计信息（弹窗展示各类型数量）
        function showStatistics() {
            var stats = {
                xdf: 0,
                highschool: 0,
                middleschool: 0,
                primaryschool: 0
            };
            // 统计各类型数量
            Object.keys(educationData).forEach(schoolName => {
                var types = educationData[schoolName].type;
                if (!Array.isArray(types)) {
                    types = [types];
                }
                types.forEach(type => {
                    stats[type]++;
                });
            });
            // 弹窗显示统计结果
            alert(`当前教育资源统计：
新东方：${stats.xdf}所
高中：${stats.highschool}所
初中：${stats.middleschool}所
小学：${stats.primaryschool}所`);
        }

        // 点击标记时显示单个学校详情
        function showSchoolInfo(schoolName, school) {
            var infoPanel = document.getElementById('infoPanel');
            var infoList = document.getElementById('infoList');
            infoPanel.style.display = 'block'; // 确保面板显示
            // 渲染单个学校详情
            var typeClass = getSchoolTypeClass(school.type);
            infoList.innerHTML = `
                <div class="education-item ${typeClass}">
                    <h4>${schoolName}</h4>
                    <p>学校等级：${school.level === 'key' ? '重点' : '普通'}</p>
                    <p>办学类型：${school.schooltype}</p>
                    <p>联系方式：${school.phone}</p>
                    <p>地址：${school.description}</p>
                </div>
            `;
        }
        // 切换所有标记标签的可见性
        function toggleLabels() {
            markers.forEach(function(marker) {
                var label = marker.getLabel();
                if (label) {
                    label.setVisible(!label.isVisible());
                }
            });
        }

        // 7. 初始化页面（加载标记和信息）
        updateInfo();
        updateMarkers();

        // 8. 监听筛选条件变化（类型筛选）
        document.getElementById('educationType').addEventListener('change', function(e) {
            currentType = e.target.value;
            updateInfo(); // 更新信息面板
            updateMarkers(); // 更新地图标记
        });

        // 9. 监听筛选条件变化（等级筛选）
        document.getElementById('schoolLevel').addEventListener('change', function(e) {
            currentLevel = e.target.value;
            updateInfo(); // 更新信息面板
            updateMarkers(); // 更新地图标记
        });
    </script>
</body>
